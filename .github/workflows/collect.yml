name: Refresh tracking snapshots
on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort. Use one off-peak minute every 15 minutes.
    # A changed cron definition also refreshes the schedule registration.
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: write
concurrency:
  group: tracking-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'websockets>=13,<17'
      - name: Collection start and trigger details
        run: |
          echo "Trigger: ${{ github.event_name }}"
          date -u '+Collection started (UTC): %Y-%m-%dT%H:%M:%SZ'
      - run: python scripts/collect.py
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Commit refreshed snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/aircraft.json data/vessels.json data/history.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit'
            exit 0
          fi
          git commit -m 'Refresh tracking snapshots'
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X ours origin main
            if git push origin HEAD:main; then
              echo 'Snapshots pushed successfully'
              exit 0
            fi
            echo "Push conflict; retrying ($attempt/5)"
            sleep 3
          done
          echo 'Unable to push snapshots after retries' >&2
          exit 1
