name: Geographic view regression tests
on:
  pull_request:
    paths:
      - 'app.js'
      - 'tests/geographic-view.test.cjs'
      - '.github/workflows/test-geographic-view.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geographic-view:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test tests/geographic-view.test.cjs
