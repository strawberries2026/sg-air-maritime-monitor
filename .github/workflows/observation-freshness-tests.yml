name: Observation freshness unit tests
on:
  pull_request:
    paths:
      - 'observation-freshness.js'
      - 'tests/observation-freshness.test.cjs'
      - 'tests/pwa-shell.test.cjs'
      - 'tests/dashboard-integration.test.cjs'
      - 'app.js'
      - 'sw.js'
      - 'index.html'
      - '.github/workflows/observation-freshness-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/observation-freshness.test.cjs tests/pwa-shell.test.cjs tests/dashboard-integration.test.cjs
