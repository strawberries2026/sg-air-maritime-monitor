name: Monitoring intelligence core tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check monitor-intelligence.js
      - run: node --check tests/monitor-intelligence.test.cjs
      - run: node --test tests/monitor-intelligence.test.cjs
