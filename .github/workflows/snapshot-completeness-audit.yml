name: Snapshot completeness audit
on:
  pull_request:
    paths:
      - 'scripts/audit_snapshot_completeness.py'
      - 'tests/test_snapshot_audit.py'
      - '.github/workflows/snapshot-completeness-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check audit syntax
        run: python -m py_compile scripts/audit_snapshot_completeness.py
      - name: Run read-only audit against published snapshots
        run: python scripts/audit_snapshot_completeness.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_snapshot_audit.py' -v
