name: Mobile navigation regression checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check mobile navigation and app references
        run: |
          node - <<'NODE'
          const fs=require('node:fs');const assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('style.css','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const navStart=html.indexOf('<nav class="bottom-nav"');
          const navEnd=html.indexOf('</nav>',navStart);
          const nav=navStart>=0&&navEnd>navStart?[html.slice(navStart,navEnd+6)]:null;
          assert.ok(nav,'Mobile bottom navigation exists');
          const tabs=[...nav[0].matchAll(/data-bottom-nav="([^"]+)"/g)].map(x=>x[1]);
          assert.deepEqual(tabs,['home','aircraft','maritime','map','vtis','more']);
          for(const id of ['map','vtis-straitrep','satellite-monitoring'])assert.ok(html.includes('id="'+id+'"'),'Missing destination '+id);
          assert.ok(css.includes('grid-template-columns:repeat(6,minmax(0,1fr))'),'Six mobile columns required');
          assert.ok(css.includes('safe-area-inset-bottom'),'Safe area missing');
          assert.ok(sw.includes("url.pathname.includes('/data/')"),'Live feed must bypass PWA cache');
          console.log('Six tabs, destinations, mobile layout and live feed bypass verified');
          NODE
