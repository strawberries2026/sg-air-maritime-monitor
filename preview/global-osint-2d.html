<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SG Global OSINT — 2D fallback</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#09192b;color:#f3f8ff;font:15px system-ui}header,footer,nav{padding:12px}h1{font-size:1.15rem}#map{height:70vh;background:#132d43}button{margin:4px;padding:10px;background:#204466;color:white;border:1px solid #84b1ce;border-radius:8px}a{color:#a8dbff}</style></head><body><header><h1>🌍 SG Global OSINT — Lightweight 2D</h1><p>Reference markers only. No live feeds or personal location access.</p></header><nav><button id="world">World</button><button id="sg">Singapore</button><button id="pb">Pedra Branca</button></nav><div id="map" role="region" aria-label="2D world map"></div><p id="status" role="status"></p><footer>Experimental preview; public map tiles require connectivity and provider availability. Not for operational decision-making. <a href="global-osint-view.html">Try 3D globe</a> · <a href="../index.html">Existing monitor</a></footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>try{if(!window.L)throw Error('Map library unavailable');const m=L.map('map',{worldCopyJump:true,minZoom:0,zoomSnap:0.25}).setView([0,0],0);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);L.marker([1.3521,103.8198]).addTo(m).bindPopup('Singapore');L.marker([1.331,104.405]).addTo(m).bindPopup('Pedra Branca (Singapore)');const navigate=(lat,lon,zoom)=>{m.closePopup();m.setView([lat,lon],zoom,{animate:false});};document.getElementById('world').onclick=()=>{m.closePopup();m.fitBounds([[-75,-175],[75,175]],{animate:false,padding:[4,4]});};document.getElementById('sg').onclick=()=>navigate(1.3521,103.8198,10);document.getElementById('pb').onclick=()=>navigate(1.331,104.405,12);document.getElementById('status').textContent='2D reference map ready';}catch(e){document.getElementById('status').textContent='Map unavailable. Please check network access or return to the existing monitor.'}</script></body></html>
